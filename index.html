<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e4f52">
<meta name="description" content="Özel eğitim ve rehabilitasyon merkezleri için günlük plan, alternatif öğrenci ve yoklama asistanı (BKDS uyumlu, KVKK-güvenli, tek dosya).">
<title>REHA Planla — Rehabilitasyon Planlama Asistanı</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230e4f52'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='%23f2c14e' font-family='Arial' font-weight='bold'%3ER%3C/text%3E%3C/svg%3E">
<style>
:root{
  --pine:#0e4f52; --pine-2:#0b3d40; --pine-lite:#e6f1f0;
  --amber:#f2a541; --amber-ink:#8a5510; --amber-bg:#fdf1dd;
  --blue:#3b6ea5; --blue-bg:#e6eef7; --blue-ink:#234a72;
  --ink:#132a2a; --muted:#5f7a79; --line:#dbe6e5;
  --bg:#f4f7f6; --card:#ffffff; --card-2:#f8fbfa;
  --ok:#1f9d6b; --ok-bg:#e3f5ec; --warn:#e0a800; --danger:#d64545; --danger-bg:#fbe7e7;
  --grad: linear-gradient(135deg,#0e4f52,#12706f 60%,#1c8a80);
  --radius:16px; --radius-sm:11px; --shadow:0 6px 22px rgba(14,79,82,.10);
  --shadow-lg:0 18px 50px rgba(14,79,82,.22);
  --font: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:1rem}
input,select,textarea{font-family:inherit;font-size:16px}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.01em}
a{color:var(--pine)}
::selection{background:var(--amber);color:#3a2400}

/* ------- Layout ------- */
.app{max-width:1180px;margin:0 auto;padding:0 14px 120px}
.topbar{position:sticky;top:0;z-index:40;background:rgba(244,247,246,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);margin:0 -14px 16px;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.05rem;color:var(--pine);letter-spacing:-.02em}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--grad);color:#f2c14e;display:grid;place-items:center;font-weight:900;box-shadow:0 3px 10px rgba(14,79,82,.35)}
.brand small{display:block;font-size:.62rem;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-top:1px}
.topbar .spacer{flex:1}
.topbar .datepill{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:6px 12px;font-weight:700;font-size:.85rem;color:var(--pine);box-shadow:var(--shadow)}
.topbar .datepill input{border:none;background:none;font-weight:700;color:var(--pine);width:130px;outline:none}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;font-size:1.15rem;box-shadow:var(--shadow);transition:.15s}
.iconbtn:hover{transform:translateY(-1px);border-color:var(--pine)}

/* ------- Nav ------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;
  color:var(--muted);font-size:.66rem;font-weight:700;transition:.15s;max-width:130px}
.nav button .ic{font-size:1.3rem;line-height:1}
.nav button.on{color:var(--pine)}
.nav button.on .ic{transform:translateY(-2px);filter:drop-shadow(0 4px 6px rgba(14,79,82,.3))}
@media(min-width:820px){
  .nav{position:sticky;top:64px;bottom:auto;max-width:1180px;margin:0 auto 16px;border-radius:16px;border:1px solid var(--line);
    box-shadow:var(--shadow);justify-content:flex-start;gap:4px;padding:6px}
  .nav button{flex-direction:row;gap:8px;font-size:.85rem;padding:9px 14px;max-width:none}
  .nav button .ic{font-size:1.1rem}
  .nav button.on{background:var(--pine-lite)}
}

/* ------- Cards & bits ------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.section-title{display:flex;align-items:center;gap:9px;margin:22px 2px 12px;font-size:1.15rem}
.section-title .k{font-size:1.35rem}
.muted{color:var(--muted)}
.hr{height:1px;background:var(--line);border:none;margin:14px 0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:.74rem;font-weight:800;
  background:var(--pine-lite);color:var(--pine);white-space:nowrap}
.chip.sabah{background:var(--amber-bg);color:var(--amber-ink)}
.chip.oglen{background:var(--blue-bg);color:var(--blue-ink)}
.chip.aktif{background:var(--ok-bg);color:#0d6b47}
.chip.mezun{background:#eee;color:#666}
.chip.askida{background:var(--danger-bg);color:#a12b2b}
.chip.grup{background:#efeafd;color:#5b3fb0}
.chip.servis{background:#eef4f1;color:#2f6a52}
.chip.kalan{background:#e8f6ee;color:#0d6b47}
.chip.dolmus{background:var(--danger-bg);color:#a12b2b}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--grad);color:#fff;
  border-radius:12px;padding:12px 18px;font-weight:800;box-shadow:0 6px 16px rgba(14,79,82,.28);transition:.15s;font-size:.95rem}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(14,79,82,.34)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:var(--card);color:var(--pine);border:1.5px solid var(--pine);box-shadow:none}
.btn.amber{background:linear-gradient(135deg,#f2a541,#e8890f);color:#3a2400;box-shadow:0 6px 16px rgba(232,137,15,.3)}
.btn.sm{padding:8px 13px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn.danger{background:linear-gradient(135deg,#e46a6a,#d64545)}
.btn[disabled]{opacity:.5;pointer-events:none}

.field{display:block;margin-bottom:12px}
.field label{display:block;font-weight:700;font-size:.82rem;color:var(--pine-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;
  background:var(--card-2);color:var(--ink);outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pine);background:#fff;box-shadow:0 0 0 3px var(--pine-lite)}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.two{grid-template-columns:1fr}}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:2.6rem;margin-bottom:8px}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .n{font-size:2rem;font-weight:900;letter-spacing:-.03em;line-height:1}
.stat .l{font-size:.78rem;font-weight:700;color:var(--muted);margin-top:4px}
.stat .k{position:absolute;right:10px;top:10px;font-size:1.5rem;opacity:.5}
.stat.a{border-left:5px solid var(--amber)}
.stat.b{border-left:5px solid var(--blue)}
.stat.g{border-left:5px solid var(--ok)}
.stat.d{border-left:5px solid var(--danger)}

/* student card */
.slist{display:grid;gap:10px}
.scard{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:11px;box-shadow:var(--shadow);transition:.15s}
.scard:hover{border-color:var(--pine)}
.avatar{width:52px;height:52px;border-radius:13px;flex:0 0 52px;background:var(--pine-lite);display:grid;place-items:center;
  font-weight:900;color:var(--pine);font-size:1.15rem;overflow:hidden;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:70px;height:70px;flex-basis:70px;border-radius:16px;font-size:1.5rem}
.scard .info{flex:1;min-width:0}
.scard .info .nm{font-weight:800;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .info .meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.scard .go{color:var(--muted);font-size:1.3rem;padding:4px}

.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.fbtn{padding:8px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-weight:700;
  font-size:.83rem;white-space:nowrap;color:var(--muted);transition:.15s;flex:0 0 auto}
.fbtn.on{background:var(--pine);color:#fff;border-color:var(--pine)}

.searchbar{display:flex;align-items:center;gap:9px;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:2px 12px;box-shadow:var(--shadow)}
.searchbar input{border:none;background:none;flex:1;padding:12px 0;outline:none}

/* plan slot */
.slot{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px;box-shadow:var(--shadow);display:flex;gap:11px;align-items:center}
.slot.geldi{border-left:5px solid var(--ok);background:linear-gradient(90deg,var(--ok-bg),#fff 30%)}
.slot.gelmedi{border-left:5px solid var(--danger);background:linear-gradient(90deg,var(--danger-bg),#fff 30%)}
.slot.planli{border-left:5px solid var(--line)}
.slot .st{display:flex;flex-direction:column;gap:3px}
.durbtns{display:flex;gap:6px}
.durbtn{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:1.1rem;background:var(--card-2)}
.durbtn.geldi.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.durbtn.gelmedi.on{background:var(--danger);color:#fff;border-color:var(--danger)}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:9500;background:rgba(10,30,30,.55);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fade .2s}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px}}
.modal{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);animation:slideup .28s cubic-bezier(.2,.9,.3,1)}
@media(min-width:640px){.modal{border-radius:22px}}
.modal .mhead{position:sticky;top:0;background:var(--bg);padding:16px 18px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);z-index:2}
.modal .mhead h3{flex:1;font-size:1.1rem}
.modal .mbody{padding:16px 18px 26px}
.xbtn{width:36px;height:36px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:1.2rem;color:var(--muted)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideup{from{transform:translateY(40px);opacity:.4}to{transform:translateY(0);opacity:1}}

/* toast */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));z-index:9700;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
.toast{background:var(--pine-2);color:#fff;padding:12px 16px;border-radius:13px;box-shadow:var(--shadow-lg);font-weight:600;font-size:.9rem;display:flex;gap:9px;align-items:center;animation:slideup .25s}
.toast.ok{background:var(--ok)}.toast.err{background:var(--danger)}.toast.warn{background:#b9820a}

/* floating controls (ZİRVE) */
.zfloat{position:fixed;z-index:60;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:999px;padding:6px 10px;box-shadow:var(--shadow);font-weight:700;font-size:.8rem;opacity:.55;transition:.2s;animation:slideup .3s}
.zfloat:hover{opacity:1}
.zfloat .x{margin-left:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.08);display:grid;place-items:center;font-size:.7rem;color:var(--muted)}
#zHelp{right:12px;bottom:calc(80px + env(safe-area-inset-bottom))}
#zQr{right:12px;bottom:calc(126px + env(safe-area-inset-bottom))}
#zScreen{left:12px;bottom:calc(80px + env(safe-area-inset-bottom))}
@media(min-width:820px){#zHelp{bottom:20px}#zQr{bottom:66px}#zScreen{bottom:20px}}

/* AI warning band */
#aiBand{position:fixed;left:8px;right:8px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:70;background:#fff8e9;border:1px solid #f0d89a;color:#7a5a10;
  border-radius:13px;padding:10px 14px;box-shadow:var(--shadow-lg);font-size:.8rem;display:flex;gap:10px;align-items:center;max-width:560px;margin:0 auto}
#aiBand .x{margin-left:auto;font-size:1.1rem;color:#a8862e;padding:2px 6px}
@media(min-width:820px){#aiBand{bottom:16px}}

/* AI answer modal formatting */
.ai-answer{line-height:1.7;font-size:.98rem}
.ai-answer h2,.ai-answer h3{color:var(--pine);margin:16px 0 7px}
.ai-answer strong,.ai-answer b{color:#0d6b47}
.ai-answer em{color:var(--amber-ink);font-style:italic}
.ai-answer ul{padding-left:20px}.ai-answer li{margin:4px 0}
.ai-answer table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.86rem}
.ai-answer th,.ai-answer td{border:1px solid var(--line);padding:7px 9px;text-align:left}
.ai-answer th{background:var(--pine-lite);color:var(--pine)}
.ai-toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.spinner{width:22px;height:22px;border:3px solid var(--pine-lite);border-top-color:var(--pine);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.loadmsg{display:flex;gap:10px;align-items:center;color:var(--muted);font-weight:600;padding:10px 0}

.keyhealth{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;font-size:.85rem;background:var(--card-2)}
.keyhealth .dot{width:11px;height:11px;border-radius:50%;flex:0 0 11px}
.dot.green{background:var(--ok)}.dot.yellow{background:var(--warn)}.dot.orange{background:#e8890f}.dot.red{background:var(--danger)}.dot.gray{background:#bbb}

.kvkk{background:var(--amber-bg);border:1px solid #f0d89a;border-radius:12px;padding:12px 14px;font-size:.82rem;color:#7a5a10;line-height:1.55}
.note-box{background:var(--pine-lite);border-radius:12px;padding:12px 14px;font-size:.85rem;color:var(--pine-2)}
details{background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:0 13px;margin-bottom:8px}
details summary{padding:12px 0;font-weight:700;cursor:pointer;color:var(--pine-2)}
details p,details ul{margin:0 0 12px}

.pill-toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.switch{width:46px;height:26px;border-radius:999px;background:#ccd6d5;position:relative;transition:.2s;flex:0 0 46px}
.switch.on{background:var(--ok)}
.switch::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on::after{left:23px}

.hidden{display:none!important}
.progress-top{position:fixed;top:0;left:0;height:3px;background:var(--amber);z-index:100;transition:width .1s;width:0}
</style>
</head>
<body>
<div class="progress-top" id="progTop"></div>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="logo">R</span>
      <span>REHA Planla<small id="brandSub">Rehabilitasyon Planlama Asistanı</small></span>
    </div>
    <div class="spacer"></div>
    <div class="datepill" id="datePillWrap" title="Aktif gün">
      <span>📅</span><input type="date" id="globalDate">
    </div>
    <button class="iconbtn" id="btnSettings" title="Ayarlar">⚙️</button>
  </div>

  <nav class="nav" id="nav">
    <button data-view="panel" class="on"><span class="ic">🏠</span>Panel</button>
    <button data-view="plan"><span class="ic">🗓️</span>Günlük Plan</button>
    <button data-view="ogrenciler"><span class="ic">👥</span>Öğrenciler</button>
    <button data-view="dersplani"><span class="ic">✨</span>Ders Planı</button>
    <button data-view="raporlar"><span class="ic">📊</span>Raporlar</button>
  </nav>

  <main id="main"></main>
</div>

<div id="toasts"></div>
<div id="modalRoot"></div>

'use strict';

/* ---------- küçük yardımcılar ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s='') => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const GUN_ADI = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const AY_ADI = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const bugunISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const isoToDate = iso => { const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); };
const insanTarih = iso => { const d=isoToDate(iso); return `${d.getDate()} ${AY_ADI[d.getMonth()]} ${d.getFullYear()}, ${GUN_ADI[d.getDay()]}`; };
const ayKey = iso => iso.slice(0,7);
const bas = s => (s||'').trim().split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();

/* ---------- toast ---------- */
function toast(msg, tip='') {
  const t = document.createElement('div');
  t.className = 'toast ' + tip;
  t.innerHTML = (tip==='ok'?'✅ ':tip==='err'?'⚠️ ':tip==='warn'?'🔔 ':'') + esc(msg);
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transform='translateY(10px)'; setTimeout(()=>t.remove(),300); }, 3200);
}

const DB_KEY = 'reha_planla_v1';
const defaultSettings = () => ({
  kurumAdi: '', personel: '', il: '', ilce: '',
  baslangic: '09:00', dersDk: 40, molaDk: 10, gunlukSlot: 8, beklemeDk: 50,
  otoHafta: true, veliWebhook: '',
  tatilGunleri: [0],                 // JS getDay: 0=Pazar
  subeler: [],                       // [{id,ad,il,ilce}]
  servisDetay: [],                   // [{ad,il,ilce,mahalleler:[]}]
  servisler: ['1. Servis','2. Servis','3. Servis','Servis Yok'],
  tanilar: ['Zihinsel Yetersizlik','Otizm (OSB)','Dil ve Konuşma Bozukluğu','İşitme Yetersizliği','Görme Yetersizliği','Bedensel Yetersizlik','Özgül Öğrenme Güçlüğü','DEHB'],
  branslar: ['Özel Eğitim Öğretmeni','Dil ve Konuşma Terapisti','Ergoterapist','Fizyoterapist','Psikolog'],
  keys: []
});
let DB = { students: [], uzmanlar: [], plans: {}, settings: defaultSettings(), _v: 1 };

function load() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      DB.students = p.students || [];
      DB.uzmanlar = p.uzmanlar || [];
      DB.plans = p.plans || {};
      DB.settings = Object.assign(defaultSettings(), p.settings || {});
      if(!Array.isArray(DB.settings.subeler)) DB.settings.subeler = [];
      if(!Array.isArray(DB.settings.servisDetay)) DB.settings.servisDetay = [];
    }
  } catch(e){ console.warn('load hata', e); }
}
let saveT;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
    catch(e){ toast('Kayıt alanı doldu olabilir. Fotoğrafları küçültün veya yedek alıp temizleyin.', 'err'); }
  }, 120);
}
const S = () => DB.settings;

/* ---------- öğrenci/uzman yardımcıları ---------- */
const aktifOgr = () => DB.students.filter(s => s.durum === 'aktif');
const ogrById = id => DB.students.find(s => s.id === id);
const uzmById = id => DB.uzmanlar.find(u => u.id === id);
function planOf(iso){ if(!DB.plans[iso]) DB.plans[iso]=[]; return DB.plans[iso]; }

// bir öğrencinin verilen ayda "geldi/yüz okundu" ders sayısı (tür bazlı)
function kullanilan(studentId, ay, tur){
  let n = 0;
  for (const iso in DB.plans){
    if (ayKey(iso) !== ay) continue;
    for (const e of DB.plans[iso]){
      if (e.studentId === studentId && e.durum === 'geldi' && (!tur || e.tur === tur)) n++;
    }
  }
  return n;
}
function kalanHak(s, ay, tur){
  const hak = tur === 'grup' ? (s.aylikGrup||0) : (s.aylikBireysel||0);
  return hak - kullanilan(s.id, ay, tur);
}

   ============================================================ */
let VIEW = 'panel';
let GDATE = bugunISO();
function go(v){ VIEW = v; $$('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.view===v)); render(); window.scrollTo({top:0}); }
function render(){
  const m = $('#main');
  if (VIEW==='panel') m.innerHTML = viewPanel();
  else if (VIEW==='plan') m.innerHTML = viewPlan();
  else if (VIEW==='ogrenciler') m.innerHTML = viewOgrenciler();
  else if (VIEW==='dersplani') m.innerHTML = viewAI();
  else if (VIEW==='raporlar') m.innerHTML = viewRaporlar();
  bindView();
}

function planSlot(e){
  const s = ogrById(e.studentId); if(!s) return '';
  const alt = e.durum==='gelmedi';
  return `<div>
    <div class="slot ${e.durum}" data-eid="${e.id}">

      <div class="info">
        <div class="nm">${esc(s.ad)} ${e.alternatifMi?'<span class="chip" style="background:#fff3d6;color:#8a5510">↔ alternatif</span>':''}</div>
        <div class="meta">
          ${(()=>{ const b=saatEkle(e.saat,e.dk||40); return `<span class="chip ${s.oturum}">${e.saat||(s.oturum==='sabah'?'Sabah':'Öğlen')}${b?'–'+b:''}</span>`; })()}
          <span class="chip ${e.tur==='grup'?'grup':''}">${e.tur==='grup'?'Grup':'Bireysel'} · ${e.dk||40}dk</span>
          ${(e.dk||40)<=40?`<span class="chip" style="background:#fdf1dd;color:#8a5510" title="Tek ders — servis düzeni gereği bekleme olabilir">⏳ ~${S().beklemeDk}dk</span>`:''}
          ${(()=>{ const c=cakismaVar(GDATE,e); return c?`<span class="chip dolmus" title="${esc(c)}">⛔ Çakışma</span>`:''; })()}
          ${s.tani?`<span class="chip servis">${esc(kisaTani(s.tani))}</span>`:''}
          ${e.uzmanId?`<span class="chip">${esc((uzmById(e.uzmanId)||{}).ad||'')}</span>`:''}
        </div>
      </div>
      <div class="durbtns">
        <button class="durbtn geldi ${e.durum==='geldi'?'on':''}" data-dur="geldi" data-eid="${e.id}" title="Yüz okundu / geldi">✅</button>
        <button class="durbtn gelmedi ${e.durum==='gelmedi'?'on':''}" data-dur="gelmedi" data-eid="${e.id}" title="Gelmedi">🚫</button>
        <button class="durbtn" data-sil="${e.id}" title="Slotu kaldır" style="border-color:var(--line)">🗑️</button>
      </div>
    </div>
    ${alt ? altPanel(e) : ''}
  </div>`;
}
function kisaTani(t){ return (t||'').replace(/\s*\(.*?\)/,'').split(' ').slice(0,2).join(' '); }
function saatEkle(hhmm, dk){
  const m=(hhmm||'').match(/^(\d{1,2}):(\d{2})$/); if(!m) return '';
  let h=+m[1], mi=+m[2]+dk; while(mi>=60){mi-=60;h++;} h%=24;
  return `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;
}

/* ----- Alternatif Beyni ----- */
function altPanel(e){
  return `<div class="card pad" style="margin:-4px 8px 6px;border-left:5px solid var(--amber);background:var(--amber-bg)">
    <div class="row" style="justify-content:space-between">
      <b style="color:var(--amber-ink)">↔ Yerine çağrılabilecekler</b>
      <button class="btn amber sm" data-altai="${e.id}">✨ AI ile sırala</button>
    </div>
    <div id="alt-${e.id}" style="margin-top:8px">${altListe(e)}</div>
  </div>`;
}
function alternatifBul(e){
  const iso = GDATE, ay = ayKey(iso), plan = planOf(iso);
  const bugunIds = new Set(plan.map(p=>p.studentId));
  const kaynak = ogrById(e.studentId) || {};
  const hedefTur = e.tur || 'bireysel';
  const hedefOturum = kaynak.oturum;
  const hedefServis = kaynak.servis;
  const hedefTani = kaynak.tani;

  const aday = aktifOgr()
    .filter(s => !bugunIds.has(s.id))
    .filter(s => hedefOturum==='farketmez' || s.oturum==='farketmez' || s.oturum===hedefOturum)
    .filter(s => s.dersTuru==='ikisi' || s.dersTuru===hedefTur || (hedefTur==='grup'? s.dersTuru==='grup':s.dersTuru==='bireysel'))
    .map(s => {
      const kalan = kalanHak(s, ay, hedefTur);
      let skor = 0;
      if (kalan>0) skor += 100 + Math.min(kalan,10)*4;
      if (s.servis===hedefServis) skor += 40;
      if (s.oturum===hedefOturum) skor += 20;
      if (s.tani===hedefTani) skor += 25;
      return { s, kalan, skor };
    })
    .filter(c => c.kalan > 0)
    .sort((a,b)=> b.skor-a.skor || b.kalan-a.kalan)
    .slice(0, 8);
  return aday;
}
function altListe(e, aiSira){
  const aday = alternatifBul(e);
  if (aday.length===0) return `<div class="muted" style="font-size:.85rem">Uygun (ders hakkı olan, oturum/servis uyumlu, bugün gelmemiş) aday bulunamadı.</div>`;
  const sirali = aiSira ? aday.slice().sort((a,b)=> (aiSira.indexOf(a.s.id)===-1?99:aiSira.indexOf(a.s.id)) - (aiSira.indexOf(b.s.id)===-1?99:aiSira.indexOf(b.s.id))) : aday;
  return `<div class="slist">${sirali.map((c,i)=>`
    <div class="scard" style="box-shadow:none;background:#fff">
      <div class="avatar">${c.s.foto?`<img src="${c.s.foto}">`:bas(c.s.ad)}</div>
      <div class="info">
        <div class="nm">${aiSira&&i===0?'⭐ ':''}${esc(c.s.ad)}</div>
        <div class="meta">
          <span class="chip ${c.s.oturum}">${c.s.oturum==='sabah'?'Sabahçı':c.s.oturum==='oglen'?'Öğlenci':'Farketmez'}</span>
          <span class="chip servis">${esc(c.s.servis||'Servis?')}</span>
          <span class="chip kalan">${c.kalan} ${e.tur==='grup'?'grup':'bireysel'} hak</span>
        </div>
      </div>
      <button class="btn sm" data-altcagir="${e.id}|${c.s.id}">Yerine çağır</button>
    </div>`).join('')}</div>`;
}

function viewRaporlar(){
  const ay = ayKey(GDATE);
  const aktif = aktifOgr();
  // servis dağılımı
  const servisMap = {};
  aktif.forEach(s=>{ const k=s.servis||'Belirsiz'; servisMap[k]=(servisMap[k]||0)+1; });
  // oturum
  const sabah = aktif.filter(s=>s.oturum==='sabah').length, oglen = aktif.filter(s=>s.oturum==='oglen').length;
  // ay içi geldi/gelmedi
  let geldiT=0, gelmediT=0;
  for(const iso in DB.plans){ if(ayKey(iso)!==ay) continue; DB.plans[iso].forEach(e=>{ if(e.durum==='geldi')geldiT++; else if(e.durum==='gelmedi')gelmediT++; }); }
  // kalan hak riski
  const riskli = aktif.map(s=>({s, kb:kalanHak(s,ay,'bireysel'), kg:kalanHak(s,ay,'grup')}))
    .filter(x=> (x.s.aylikBireysel&&x.kb>0) || (x.s.aylikGrup&&x.kg>0))
    .sort((a,b)=> (b.kb+b.kg)-(a.kb+a.kg)).slice(0,12);

  const maxServ = Math.max(1,...Object.values(servisMap));
  return `
  <h2>Raporlar</h2>
  <div class="chip" style="margin:8px 0">${AY_ADI[isoToDate(GDATE).getMonth()]} ${isoToDate(GDATE).getFullYear()}</div>
  <div class="stats" style="margin:8px 0 16px">
    <div class="stat g"><div class="k">✅</div><div class="n">${geldiT}</div><div class="l">Bu ay okunan/gelen ders</div></div>
    <div class="stat d"><div class="k">🚫</div><div class="n">${gelmediT}</div><div class="l">Bu ay gelmeyen</div></div>
    <div class="stat a"><div class="k">🌅</div><div class="n">${sabah}</div><div class="l">Sabahçı</div></div>
    <div class="stat b"><div class="k">🌆</div><div class="n">${oglen}</div><div class="l">Öğlenci</div></div>
  </div>

  <div class="section-title"><span class="k">🚌</span> Servis güzergâhı dağılımı</div>
  <div class="card pad">
    ${Object.keys(servisMap).length===0?'<div class="muted">Veri yok.</div>':
    Object.entries(servisMap).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
      <div style="margin-bottom:9px">
        <div class="row" style="justify-content:space-between;font-size:.85rem;font-weight:700"><span>${esc(k)}</span><span>${v}</span></div>
        <div style="height:9px;background:var(--pine-lite);border-radius:9px;overflow:hidden;margin-top:3px"><div style="height:100%;width:${v/maxServ*100}%;background:var(--grad)"></div></div>
      </div>`).join('')}
  </div>

  <div class="section-title"><span class="k">🎯</span> Ders hakkı olan öğrenciler <span class="muted" style="font-size:.8rem;font-weight:600">(alternatif havuzu)</span></div>
  <div class="card pad">
    ${riskli.length===0?'<div class="muted">Aylık hak tanımlı öğrenci yok ya da haklar dolmuş.</div>':`
    <table class="ai-answer" style="width:100%;border-collapse:collapse">
      <tr><th style="text-align:left">Öğrenci</th><th>Bireysel kalan</th><th>Grup kalan</th></tr>
      ${riskli.map(x=>`<tr><td>${esc(x.s.ad)}</td><td style="text-align:center">${x.s.aylikBireysel?x.kb:'—'}</td><td style="text-align:center">${x.s.aylikGrup?x.kg:'—'}</td></tr>`).join('')}
    </table>
    <div class="muted" style="font-size:.78rem;margin-top:8px">💡 Kalan hakkı yüksek olanlar, boş slot açıldığında ilk çağrılacak isimlerdir.</div>`}
  </div>
  <div class="section-title"><span class="k">🔁</span> Telafi önerilenler <span class="muted" style="font-size:.8rem;font-weight:600">(bu ay gelmeyenler)</span></div>
  <div class="card pad">
    ${(()=>{ const tl=telafiGerekenler(ay); return tl.length===0?'<div class="muted">Bu ay telafi gerektiren devamsızlık yok. 👍</div>':`
      <div class="slist">${tl.slice(0,12).map(x=>`<div class="scard" style="box-shadow:none"><div class="avatar">${x.s.foto?`<img src="${x.s.foto}">`:bas(x.s.ad)}</div><div class="info"><div class="nm">${esc(x.s.ad)}</div><div class="meta"><span class="chip dolmus">${x.gelmedi} gün gelmedi</span><span class="chip servis">${esc(x.s.servis||'')}</span></div></div></div>`).join('')}</div>

function durumDegis(eid, dur){
  const e = planOf(GDATE).find(x=>x.id===eid); if(!e) return;
  e.durum = (e.durum===dur) ? 'planli' : dur;
  save(); render();
  if(e.durum==='geldi') toast('Yüz okundu ✓ öğrenci çıkabilir','ok');
}
function altCagir(combo){
  const [eid, sid] = combo.split('|');
  const e = planOf(GDATE).find(x=>x.id===eid); if(!e) return;
  const s = ogrById(sid); if(!s) return;
  planOf(GDATE).push({ id:uid(), studentId:sid, saat:e.saat, tur:e.tur, uzmanId:e.uzmanId, durum:'planli', alternatifMi:true });
  save(); render();
  toast(`${s.ad} yerine plana eklendi`,'ok');
}
async function altAISirala(eid){
  const e = planOf(GDATE).find(x=>x.id===eid); if(!e) return;
  const aday = alternatifBul(e);
  if(aday.length<2){ toast('Sıralanacak yeterli aday yok'); return; }
  if(!keysVar()){ toast('AI için Ayarlar’dan Gemini anahtarı girin','warn'); openSettings(); return; }
  const box = $('#alt-'+eid); if(box) box.innerHTML = `<div class="loadmsg"><span class="spinner"></span> AI adayları değerlendiriyor…</div>`;
  const kaynak = ogrById(e.studentId)||{};
  const liste = aday.map((c,i)=>`${i+1}) id:${c.s.id} | ${c.s.ad} | tanı:${c.s.tani||'-'} | servis:${c.s.servis||'-'} | oturum:${c.s.oturum} | kalan ${e.tur} hak:${c.kalan}`).join('\n');
  const prompt = `Bir özel eğitim ve rehabilitasyon merkezinde saat ${e.saat||''} slotunda "${kaynak.ad||'bir öğrenci'}" (tanı: ${kaynak.tani||'-'}, servis: ${kaynak.servis||'-'}, ${e.tur} ders) gelmedi. Boşalan slota çağrılabilecek adaylar aşağıda. Uygunluğa göre (ders hakkı fazlalığı, aynı servis, aynı oturum, benzer tanı/grup uyumu) EN İYİDEN kötüye SIRALA. SADECE id değerlerini virgülle, tek satırda ver, başka hiçbir şey yazma.\n\nAdaylar:\n${liste}`;
  try{
    const cevap = await generateText(prompt, {kisa:true});
    const idSira = cevap.replace(/[^a-z0-9,\s]/gi,' ').split(/[,\s]+/).filter(Boolean);
    if(box) box.innerHTML = altListe(e, idSira);
    $$('[data-altcagir]',box||document).forEach(b=>b.onclick=()=>altCagir(b.dataset.altcagir));
    toast('AI sıraladı ⭐','ok');
  }catch(err){ if(box) box.innerHTML = altListe(e); toast(err.message||'AI hatası','err'); }
}

/* ---------- Fotoğraf: küçültülmüş base64 ---------- */
function resimKucult(file, cb, max=260){
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      let {width:w, height:h} = img;
      const sc = Math.min(1, max/Math.max(w,h));
      w=Math.round(w*sc); h=Math.round(h*sc);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.72));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

function slotSaatleri(oturum){
  const st=S(); const out=[];
  let [h,m] = st.baslangic.split(':').map(Number);
  if(oturum==='oglen'){ h=13; m=0; }
  const adet = st.gunlukSlot||8;
  for(let i=0;i<adet;i++){
    out.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
    m += (st.dersDk||40) + (st.molaDk||10);
    while(m>=60){ m-=60; h++; }
  }
  return out;
}

function mdToHtml(md){
  let h = esc(md);
  h = h.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h2>$1</h2>');
  h = h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>');
  // tablolar
  h = h.replace(/((?:^\|.*\|\s*$\n?)+)/gm, (blk)=>{
    const lines = blk.trim().split('\n').filter(l=>/\|/.test(l));
    if(lines.length<2) return blk;
    const cells = l=>l.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
    let t='<table>'; cells(lines[0]).forEach(()=>{});
    t+='<tr>'+cells(lines[0]).map(c=>`<th>${c}</th>`).join('')+'</tr>';
    lines.slice(2).forEach(l=>{ t+='<tr>'+cells(l).map(c=>`<td>${c}</td>`).join('')+'</tr>'; });
    return t+'</table>';
  });
  h = h.replace(/^\s*[-•] (.*)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g, m=>`<ul>${m}</ul>`);
  h = h.replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');
  return `<p>${h}</p>`;
}

/* devamı app3.js: ZİRVE (API ring, model, ayarlar, floating, welcome, qr, share) */
/* ============================================================
   ZİRVE KATMANI
   ============================================================ */
window.ZIRVE = window.ZIRVE || {};
window.ZIRVE_kontroller = [];

/* ---- 1. Çoklu anahtar halkası ---- */
const GOMULU_ANAHTARLAR = [
  // Buraya kalıcı anahtar gömülebilir (yeni projeye kopyalanınca otomatik yüklenir):
  // 'AIza...'
];
function ringLoad(){
  if(!S().keys || S().keys.length===0){
    if(GOMULU_ANAHTARLAR.length){ S().keys = GOMULU_ANAHTARLAR.map(k=>({key:k,durum:'gray'})); save(); }
  }
  return (S().keys||[]).map(x=>x.key).filter(Boolean);
}
let ringIdx = 0;
function nextKey(){ const ks=ringLoad(); if(!ks.length) return null; const k=ks[ringIdx%ks.length]; ringIdx++; return k; }
function keysVar(){ return ringLoad().length>0; }
function maske(k){ return k? k.slice(0,6)+'…'+k.slice(-4) : ''; }

/* ---- 2. Canlı model keşfi ---- */
let MODEL_CACHE = null;
const MODEL_ALIAS = { 'gemini-flash-latest':'gemini-2.5-flash', 'gemini-pro-latest':'gemini-2.5-pro' };
async function modelBul(vision=false){
  if(MODEL_CACHE) return MODEL_CACHE;
  const ks=ringLoad(); if(!ks.length) throw new Error('Önce Gemini API anahtarı girin (⚙️ Ayarlar).');
  for(const k of ks){
    try{
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${k}`);
      if(!r.ok) continue;
      const d = await r.json();
      const names = (d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/',''));
      const tercih = ['gemini-2.5-flash','gemini-2.0-flash','gemini-2.5-pro','gemini-1.5-flash','gemini-flash-latest'];
      let sec = tercih.find(t=>names.includes(t)) || names.find(n=>/flash/.test(n)) || names[0];
      sec = MODEL_ALIAS[sec]||sec;
      if(sec){ MODEL_CACHE=sec; return sec; }
    }catch(e){}
  }
  MODEL_CACHE='gemini-2.5-flash'; return MODEL_CACHE;
}

/* ---- 3. generateText: streaming + akıllı hata ---- */
async function generateText(prompt, opt={}){
  const ks=ringLoad(); if(!ks.length) throw new Error('Gemini API anahtarı gerekli. ⚙️ Ayarlar’dan ekleyin.');
  const model = await modelBul();
  const gConf = { temperature:0.6, thinkingConfig:{ thinkingBudget:0 } };
  if(opt.kisa) gConf.maxOutputTokens = 800;
  const body = { contents:[{ role:'user', parts:[{text:prompt}] }], generationConfig:gConf };
  let sonHata='';
  for(let t=0;t<ks.length;t++){
    const key = nextKey();
    try{
      if(opt.onChunk){
        const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${key}`;
        const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        if(!r.ok){ sonHata=await hataMetni(r); if(kotaMi(r.status)) continue; if(r.status===400){ delete body.generationConfig.thinkingConfig; continue; } continue; }
        const reader=r.body.getReader(); const dec=new TextDecoder(); let buf='', tam='';
        while(true){ const {done,value}=await reader.read(); if(done) break; buf+=dec.decode(value,{stream:true});
          const parts=buf.split('\n'); buf=parts.pop();
          for(const line of parts){ if(!line.startsWith('data:')) continue; const js=line.slice(5).trim(); if(!js||js==='[DONE]') continue;
            try{ const o=JSON.parse(js); const tx=o?.candidates?.[0]?.content?.parts?.[0]?.text||''; if(tx){ tam+=tx; opt.onChunk(tx);} }catch(e){} } }
        if(tam) return tam;
        continue;
      } else {
        const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
        const r = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        if(!r.ok){ sonHata=await hataMetni(r); if(kotaMi(r.status)) continue; if(r.status===400){ delete body.generationConfig.thinkingConfig; const r2=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); if(r2.ok){ const d2=await r2.json(); return d2?.candidates?.[0]?.content?.parts?.[0]?.text||''; } } continue; }
        const d=await r.json(); return d?.candidates?.[0]?.content?.parts?.[0]?.text||'';
      }
    }catch(e){ sonHata=e.message; }
  }
  throw new Error(sonHata || 'Tüm anahtarlar denendi, yanıt alınamadı. Kota dolmuş olabilir.');
}
const kotaMi = st => st===429 || st===503;
async function hataMetni(r){
  try{ const d=await r.clone().json(); const m=d?.error?.message||''; 
    if(r.status===429) return 'Kota doldu (dakikalık/günlük limit). Biraz sonra tekrar deneyin.';
    if(r.status===503) return 'Model geçici meşgul (503). Tekrar deneyin.';
    if(r.status===404) return 'Model bulunamadı (404).';
    if(r.status===400) return 'Geçersiz istek: '+m;
    if(r.status===401) return 'Anahtar geçersiz/yetkisiz (401). Bu anahtarı silin, yeni bir tane alın.';
    if(r.status===403) return 'İzin yok / anahtar geçersiz (403).';
    return `Hata ${r.status}: ${m}`;
  }catch(e){ return `Ağ/sunucu hatası (${r.status}).`; }
}

window.ZIRVE.anahtarTest = async function(key){

    if(r.status===429) return {ok:false,durum:'yellow',mesaj:'Geçerli ama kota dolu'};
    if(r.status===401) return {ok:false,durum:'red',mesaj:'Geçersiz/yetkisiz anahtar (401) — silin'};
    if(r.status===400||r.status===403) return {ok:false,durum:'red',mesaj:'Geçersiz anahtar / izin yok'};
    return {ok:false,durum:'red',mesaj:'Hata '+r.status};
  }catch(e){ return {ok:false,durum:'red',mesaj:'Ağ hatası'}; }
};

window.ZIRVE.duzMetin = function(str=''){
  let s = String(str);
  s = s.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|li|h[1-6]|div|tr)>/gi,'\n').replace(/<[^>]+>/g,'');
  s = s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&nbsp;/g,' ');
  s = s.replace(/^#{1,6}\s*/gm,'').replace(/\*\*(.+?)\*\*/g,'$1').replace(/\*(.+?)\*/g,'$1').replace(/`(.+?)`/g,'$1').replace(/^\s*>\s?/gm,'').replace(/^\s*[-•]\s/gm,'• ').replace(/\[(.+?)\]\((.+?)\)/g,'$1 ($2)');
  return s.replace(/\n{3,}/g,'\n\n').trim();
};
window.ZIRVE_whatsappMetin = function(md=''){
  let s = window.ZIRVE.duzMetin(md);
  return s;
};

function cdnYukle(src){ return new Promise((res,rej)=>{ if([...document.scripts].some(s=>s.src===src)) return res(); const el=document.createElement('script'); el.src=src; el.onload=res; el.onerror=()=>rej(new Error('CDN yüklenemedi (internet?)')); document.head.appendChild(el); }); }
function kartYap(html, baslik){
  const w=document.createElement('div');
  w.style.cssText='position:fixed;left:-9999px;top:0;width:640px;background:#0b1220;color:#e6f1f0;padding:26px;font-family:system-ui;border-radius:0';
  w.innerHTML=`<div style="font-size:1.2rem;font-weight:900;color:#a7f3d0;margin-bottom:14px">✨ ${esc(baslik||'REHA Planla')}</div>
    <div class="zshare-body" style="line-height:1.7">${html}</div>
    <div style="margin-top:18px;font-size:.72rem;color:#5f8a86">🗂️ REHA Planla — Rehabilitasyon Planlama Asistanı</div>`;
  w.querySelectorAll('strong,b').forEach(e=>e.style.color='#34d399');
  w.querySelectorAll('h2,h3').forEach(e=>e.style.color='#a7f3d0');
  w.querySelectorAll('em,i').forEach(e=>e.style.color='#fcd34d');
  w.querySelectorAll('th').forEach(e=>{e.style.background='#123'; e.style.color='#a7f3d0'; e.style.border='1px solid #24506b'; e.style.padding='6px';});
  w.querySelectorAll('td').forEach(e=>{e.style.border='1px solid #24506b'; e.style.padding='6px'; e.style.color='#e6f1f0';});
  document.body.appendChild(w); return w;
}
window.ZIRVE_gorselPaylas = async function({html,el,baslik}){
  try{
    await cdnYukle('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js');
    let node, temp=false;
    if(el){ node=el; } else { node=kartYap(html,baslik); temp=true; }
    const cv = await html2canvas(node,{scale:2,backgroundColor:el?'#ffffff':'#0b1220',useCORS:true});
    if(temp) node.remove();
    cv.toBlob(async (blob)=>{
      const file=new File([blob],`${baslik||'reha'}.png`,{type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:baslik}); return; }catch(e){} }
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=file.name; a.click(); toast('Görsel indirildi ✓','ok');
    },'image/png');
  }catch(e){ toast(e.message||'Görsel oluşturulamadı','err'); }
};
window.ZIRVE_pdfPaylas = async function({html,el,baslik}){
  try{
    await cdnYukle('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js');
    await cdnYukle('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
    let node, temp=false;
    if(el){ node=el; } else { node=kartYap(html,baslik); temp=true; }
    const cv = await html2canvas(node,{scale:2,backgroundColor:el?'#ffffff':'#0b1220',useCORS:true});
    if(temp) node.remove();
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4'); const W=210, H=297;
    const iw=W, ih=cv.height*W/cv.width; let pos=0;
    if(!el){ pdf.setFillColor(11,18,32); }
    let left=ih;
    while(left>0){ if(pos>0) pdf.addPage(); if(!el){ pdf.setFillColor(11,18,32); pdf.rect(0,0,W,H,'F'); }
      pdf.addImage(cv.toDataURL('image/png'),'PNG',0,-pos,iw,ih); pos+=H; left-=H; }
    pdf.save(`${baslik||'reha'}.pdf`); toast('PDF indirildi ✓','ok');
  }catch(e){ toast(e.message||'PDF oluşturulamadı','err'); }
};

const TR_API = 'https://api.turkiyeapi.dev/v2';
async function apiGetFull(url){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),12000);
  try{ const r=await fetch(url,{signal:c.signal}); clearTimeout(t); if(!r.ok) throw new Error('http '+r.status); return await r.json(); }
  catch(e){ clearTimeout(t); throw e; }
}
async function apiGet(url){ const j=await apiGetFull(url); return j.data||j; }
const trLower = s => (s||'').toLocaleLowerCase('tr');
function illeriEmbedded(){ return Object.keys(TR_ILILCE).sort((a,b)=>a.localeCompare(b,'tr')); }

function ilDoldur(sel, secili, onChange){
  sel.innerHTML = `<option value="">— İl seç —</option>` + illeriEmbedded().map(n=>`<option ${n===secili?'selected':''}>${esc(n)}</option>`).join('');
  sel.onchange=()=>{ if(onChange) onChange(sel.value); };
}
function ilceDoldur(ilName, sel, secili){
  if(!ilName){ sel.innerHTML=`<option value="">— Önce il —</option>`; return; }
  const arr=(TR_ILILCE[ilName]||[]).slice().sort((a,b)=>a.localeCompare(b,'tr'));
  sel.innerHTML = `<option value="">— İlçe seç —</option>` + arr.map(n=>`<option ${n===secili?'selected':''}>${esc(n)}</option>`).join('');
}
// il adı → API id (name filtresi)
async function _ilId(ilName){
  const q = ilName==='Afyon'?'Afyonkarahisar':ilName;
  const d = await apiGet(`${TR_API}/provinces?name=${encodeURIComponent(q)}&fields=id,name&limit=10`);
  const m=(d||[]).find(x=>trLower(x.name)===trLower(q)) || (d||[])[0];
  return m?m.id:null;
}
// il id + ilçe adı → ilçe id (provinceId filtresi — nested DEĞİL)
async function _ilceId(ilId, ilceName){
  const d = await apiGet(`${TR_API}/districts?provinceId=${ilId}&fields=id,name&limit=100`);
  const q=trLower(ilceName);
  const m = (d||[]).find(x=>trLower(x.name)===q) || (d||[]).find(x=>trLower(x.name).startsWith(q.slice(0,4)));
  return m?m.id:null;
}
// mahalleler — SAYFALI (limit 100), büyük limit 400 vermesin
async function tumMahalleler(ilceId){
  let out=[], offset=0, total=Infinity, guard=0;
  while(offset<total && guard<50){
    const j = await apiGetFull(`${TR_API}/districts/${ilceId}/neighborhoods?fields=name&limit=100&offset=${offset}`);
    const d = j.data||[]; out=out.concat(d.map(x=>x.name));
    total = (j.meta && typeof j.meta.total==='number') ? j.meta.total : out.length;
    offset+=100; guard++; if(d.length<100) break;
  }
  return [...new Set(out)];
}
async function mahalleGetirByName(ilName, ilceName){
  const ilId=await _ilId(ilName); if(!ilId) throw new Error('il eşleşmedi');
  const ilceId=await _ilceId(ilId, ilceName); if(!ilceId) throw new Error('ilçe eşleşmedi');
  const mh=await tumMahalleler(ilceId);
  if(!mh.length) throw new Error('mahalle bulunamadı');
  return mh;
}

function telafiGerekenler(ay){
  const out=[];
  aktifOgr().forEach(s=>{
    let gelmedi=0;
    for(const iso in DB.plans){ if(ayKey(iso)!==ay) continue; DB.plans[iso].forEach(e=>{ if(e.studentId===s.id && e.durum==='gelmedi') gelmedi++; }); }

function isoOf(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function haftaGunleri(iso){
  const d=isoToDate(iso), dow=d.getDay();
  const pzt=new Date(d); pzt.setDate(d.getDate()-((dow+6)%7)); // haftanın Pazartesi'si
  const arr=[]; for(let i=0;i<7;i++){ const x=new Date(pzt); x.setDate(pzt.getDate()+i); arr.push(isoOf(x)); }
  return arr;
}
const ONAY_ETIKET = { beklemede:'⏳ Onay bekliyor', onaylandi:'✅ Veli onayladı', degisiklik:'✏️ Değişiklik istendi' };
const ONAY_CHIP = { beklemede:'', onaylandi:'aktif', degisiklik:'askida' };

  const st=S();
  const satir = (s.program||[]).slice().sort((a,b)=>a.gun-b.gun||(a.saat||'').localeCompare(b.saat||''))
    .map(p=>{ const u=uzmById(p.uzmanId); const bit=saatEkle(p.saat,p.dk||40);
      return `• ${GUN_ADI[p.gun]} ${p.saat||''}${bit?'–'+bit:''} — ${p.tur==='grup'?'Grup':'Bireysel'} — ${u?u.ad+' ('+u.brans+')':'(uzman atanmadı)'}`; }).join('\n');
  return `Sayın ${s.veli||'velimiz'},\n\n${s.ad} için haftalık ders programı:\n${satir||'(ders eklenmedi)'}\n\nProgramı onaylıyorsanız lütfen "ONAYLIYORUM" yazın; değişiklik gerekiyorsa gün/saat belirtin.\n\n${st.kurumAdi||''}`.trim();
}

function otoHaftaKontrol(){
  if(!S().otoHafta) return;
  const hafta = haftaGunleri(bugunISO());
  const bayrak = 'reha_otohafta_'+hafta[0];
  if(localStorage.getItem(bayrak)) return;      // bu hafta zaten yapıldı
  const onayli = aktifOgr().filter(s=> s.veliOnay==='onaylandi' && (s.program||[]).length);
  if(!onayli.length){ localStorage.setItem(bayrak,'1'); return; }
  let eklendi=0;
  onayli.forEach(s=> s.program.forEach(p=>{
    const iso=hafta.find(d=>isoToDate(d).getDay()===p.gun); if(!iso) return;
    if(planOf(iso).some(x=>x.studentId===s.id && x.saat===p.saat)) return;
    planOf(iso).push({id:uid(),studentId:s.id,saat:p.saat,tur:p.tur,dk:p.dk||40,uzmanId:p.uzmanId,durum:'planli',alternatifMi:false,programdan:true}); eklendi++;
  }));
  localStorage.setItem(bayrak,'1');
  if(eklendi){ save(); setTimeout(()=>toast(`🤖 Otomatik: ${eklendi} onaylı ders bu haftanın planına yüklendi`,'ok'), 800); }
}

function bugunuProgramdanDoldur(){
  const gun=isoToDate(GDATE).getDay();
  const onayli=aktifOgr().filter(s=> s.veliOnay==='onaylandi' && (s.program||[]).length);

    planOf(GDATE).push({id:uid(),studentId:s.id,saat:p.saat,tur:p.tur,dk:p.dk||40,uzmanId:p.uzmanId,durum:'planli',alternatifMi:false,programdan:true}); eklendi++;

function bosSlotAlternatifDoldur(){
  const plan=planOf(GDATE);
  const gelmeyenler=plan.filter(e=>e.durum==='gelmedi');
  if(!gelmeyenler.length){ toast('Boş (gelmedi) slot yok','warn'); return; }
  let dolduruldu=0; const kullanilanlar=new Set(plan.map(p=>p.studentId));
  gelmeyenler.forEach(e=>{
    const aday=alternatifBul(e).filter(c=>!kullanilanlar.has(c.s.id));
    if(aday.length){ const c=aday[0]; kullanilanlar.add(c.s.id);
      plan.push({id:uid(),studentId:c.s.id,saat:e.saat,tur:e.tur,dk:e.dk||40,uzmanId:e.uzmanId,durum:'planli',alternatifMi:true}); dolduruldu++; }
  });
  save(); render();
  toast(dolduruldu?`🤖 ${dolduruldu} boş slota alternatif atandı ✓`:'Uygun alternatif bulunamadı', dolduruldu?'ok':'warn');
}

/* ---- Çakışma kontrolü (uzman/öğrenci aynı saatte) ---- */
function cakismaVar(iso, e){
  const s=ogrById(e.studentId); if(!s) return null;
  const a1=saatDk(e.saat), a2=a1+(e.dk||40);
  for(const x of planOf(iso)){
    if(x.id===e.id) continue;
    const b1=saatDk(x.saat), b2=b1+(x.dk||40);
    const kesisir = a1<b2 && b1<a2;
    if(!kesisir) continue;
    if(x.studentId===e.studentId) return 'Öğrenci çakışması';
    if(e.uzmanId && x.uzmanId===e.uzmanId) return 'Uzman çakışması: '+((uzmById(e.uzmanId)||{}).ad||'');
  }
  return null;
}
function saatDk(hhmm){ const m=(hhmm||'').match(/(\d{1,2}):(\d{2})/); return m? (+m[1])*60+(+m[2]) : 0; }

async function sha256hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function siteId(){
  let id = localStorage.getItem(LIS.SIDKEY);
  if(!id){ id = [...crypto.getRandomValues(new Uint8Array(6))].map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase(); localStorage.setItem(LIS.SIDKEY, id); }
  return id; // 12 hex
}
const grupla = (s,n=4)=> s.replace(/(.{4})/g,'$1-').replace(/-$/,'');
function kurulumKodu(){ return 'K-'+grupla(siteId()); }
async function imzaUret(sid, expField){ return (await sha256hex(sid+'|'+expField+'|'+LIS.SECRET)).slice(0,8).toUpperCase(); }
async function aktivasyonKoduUret(sid, expField){ // expField: '00000000' süresiz | 'YYYYMMDD'
  const sig = await imzaUret(sid, expField);
  return 'RHA-'+grupla(expField+sig);
}
function temizKod(k){ return (k||'').toUpperCase().replace(/[^0-9A-Z]/g,'').replace(/^RHA/,''); }
async function aktivasyonDogrula(sid, girilen){
  const t = temizKod(girilen);
  if(t.length<16) return {ok:false, sebep:'Kod eksik/hatalı'};
  const expField = t.slice(0,8), sig = t.slice(8,16);
  const beklenen = await imzaUret(sid, expField);
  if(sig!==beklenen) return {ok:false, sebep:'Kod bu kuruluma ait değil'};
  if(expField!=='00000000'){
    const exp = new Date(+expField.slice(0,4), +expField.slice(4,6)-1, +expField.slice(6,8), 23,59,59);
    if(Date.now()>exp.getTime()) return {ok:false, sebep:'Lisans süresi dolmuş ('+expField.slice(6,8)+'.'+expField.slice(4,6)+'.'+expField.slice(0,4)+')'};
  }
  return {ok:true, expField};
}
function lisansKaydet(expField){ localStorage.setItem(LIS.LKEY, JSON.stringify({exp:expField, t:Date.now()})); }
function lisansOku(){ try{ return JSON.parse(localStorage.getItem(LIS.LKEY)||'null'); }catch(e){ return null; } }
async function lisansGecerli(){
  const l = lisansOku(); if(!l) return false;
  const r = await aktivasyonDogrula(siteId(), 'RHA-'+l.exp+ await imzaUret(siteId(), l.exp));
  return r.ok;
}
function lisansGunKalan(){
  const l=lisansOku(); if(!l||l.exp==='00000000') return null;
  const exp=new Date(+l.exp.slice(0,4), +l.exp.slice(4,6)-1, +l.exp.slice(6,8),23,59,59);
  return Math.ceil((exp-Date.now())/86400000);
}

/* ---------- CSV/TSV ayrıştırıcı (ayraç sezme + tırnak) ---------- */
function ayracSez(text){
  const satir=(text.split(/\r?\n/).find(l=>l.trim())||'');
  const say=ch=>(satir.match(new RegExp('\\'+ch,'g'))||[]).length;
  const t=say('\t'), n=say(';'), c=say(',');
  if(t>=n && t>=c && t>0) return '\t';
  if(n>=c && n>0) return ';';
  return ',';
}
function csvParse(text){
  const sep=ayracSez(text); const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch==='"') q=true; else if(ch===sep){ row.push(cur); cur=''; } else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; } else if(ch==='\r'){} else cur+=ch; }
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>(c||'').trim()!==''));
}

/* ---------- Değer normalleştiriciler ---------- */
const normOturum = v=>{ const s=trLower(v); if(s.includes('sabah'))return'sabah'; if(s.includes('öğle')||s.includes('ogle')||s.includes('öğlen')||s.includes('oglen'))return'oglen'; if(s.includes('fark'))return'farketmez'; return'sabah'; };
const normTur = v=>{ const s=trLower(v); const g=s.includes('grup'), b=s.includes('birey'); if((g&&b)||s.includes('ikisi'))return'ikisi'; if(g)return'grup'; return'bireysel'; };
const normDurum = v=>{ const s=trLower(v); if(s.includes('mezun'))return'mezun'; if(s.includes('ask')||s.includes('pasif'))return'askida'; return'aktif'; };
const GUN_MAP = {pazartesi:1,pzt:1,pt:1,salı:2,sali:2,sal:2,çarşamba:3,carsamba:3,çar:3,car:3,perşembe:4,persembe:4,per:4,cuma:5,cum:5,cumartesi:6,cmt:6,cts:6,pazar:0,paz:0};
function normGunler(v){ if(!v)return[1,2,3,4,5]; const out=new Set();
  String(v).split(/[,\/;\s]+/).forEach(p=>{ const t=trLower(p.trim()); if(t==='')return; if(/^\d$/.test(t)){out.add(+t);return;} if(GUN_MAP[t]!==undefined)out.add(GUN_MAP[t]); for(const k in GUN_MAP){ if(t.startsWith(k.slice(0,3))){out.add(GUN_MAP[k]);break;} } });
  return out.size?[...out].sort():[1,2,3,4,5];
}

/* ---------- Başlık eşleme ---------- */
const OGR_ALIAS = { ad:['ad','adsoyad','adısoyadı','isim','öğrenci','ogrenci','adsoyadı','isimsoyisim','name'],
  oturum:['oturum','seans','vardiya'], servis:['servis','güzergah','guzergah','servisgüzergahı','hat'],
  dersTuru:['derstürü','dersturu','tür','tur','tip','type'], tani:['tanı','tani','yetersizlik','tanıalanı','engel'],
  aylikBireysel:['bireysel','aylıkbireysel','bireyselhak','bireyselsaat','bireyselders'],
  aylikGrup:['grup','aylıkgrup','gruphak','grupsaat','grupders'],
  durum:['durum','statü','statu','status'], veli:['veli','veliadı','veliad'], telefon:['telefon','tel','gsm','cep','telefonno'] };
const UZM_ALIAS = { ad:['ad','adsoyad','isim','uzman','öğretmen','ogretmen','name'], brans:['branş','brans','uzmanlık','uzmanlik','ünvan','unvan','görev','gorev','bölüm','bolum'],
  oturum:['oturum','seans','vardiya'], gunler:['gün','gun','günler','gunler','çalışmagünleri','calismagunleri','days'] };
const sadeBaslik = s => trLower(s).replace(/[\s_./-]/g,'');
function basliklariEsle(headerRow, alias){
  const idx={}; headerRow.forEach((h,i)=>{ const hs=sadeBaslik(h); for(const key in alias){ if(alias[key].some(a=>hs===a||hs.includes(a)||a.includes(hs)&&hs.length>2)){ if(idx[key]===undefined) idx[key]=i; } } });
  return idx;
}
function basliksatiriMi(row, alias){ const idx=basliklariEsle(row,alias); return Object.keys(idx).length>=2; }

/* ---------- Satırları kayıda çevir ---------- */
function ogrKayitlariUret(rows){
  if(!rows.length) return [];
  const st=S(); const varsayilanServis=st.servisler[0]||'', varsayilanTani=st.tanilar[0]||'';
  let idx, veri;
  if(basliksatiriMi(rows[0],OGR_ALIAS)){ idx=basliklariEsle(rows[0],OGR_ALIAS); veri=rows.slice(1); }
  else if(rows[0].length===1){ idx={ad:0}; veri=rows; } // tek sütun: sadece isim
  else { idx={ad:0,oturum:1,servis:2,dersTuru:3,tani:4,aylikBireysel:5,aylikGrup:6,durum:7,veli:8,telefon:9}; veri=rows; }
  const al=(r,k)=> idx[k]!==undefined ? (r[idx[k]]||'').trim() : '';
  return veri.map(r=>{ const ad=al(r,'ad'); if(!ad) return null;
    return { id:uid(), ad, foto:null,
      oturum: idx.oturum!==undefined?normOturum(al(r,'oturum')):'sabah',
      servis: al(r,'servis')||varsayilanServis,
      dersTuru: idx.dersTuru!==undefined?normTur(al(r,'dersTuru')):'bireysel',
      tani: al(r,'tani')||varsayilanTani,
      bransIhtiyac: st.branslar[0]||'',
      aylikBireysel: parseInt(al(r,'aylikBireysel'))||0,
      aylikGrup: parseInt(al(r,'aylikGrup'))||0,
      durum: idx.durum!==undefined?normDurum(al(r,'durum')):'aktif',
      veli: al(r,'veli'), telefon: al(r,'telefon'), notlar:'', createdAt:Date.now() };
  }).filter(Boolean);
}
function uzmKayitlariUret(rows){
  if(!rows.length) return [];
  const st=S(); let idx,veri;
  if(basliksatiriMi(rows[0],UZM_ALIAS)){ idx=basliklariEsle(rows[0],UZM_ALIAS); veri=rows.slice(1); }
  else if(rows[0].length===1){ idx={ad:0}; veri=rows; }
  else { idx={ad:0,brans:1,oturum:2,gunler:3}; veri=rows; }
  const al=(r,k)=> idx[k]!==undefined ? (r[idx[k]]||'').trim() : '';
  return veri.map(r=>{ const ad=al(r,'ad'); if(!ad) return null;
    return { id:uid(), ad, foto:null, brans: al(r,'brans')||st.branslar[0]||'Özel Eğitim Öğretmeni',
      oturum: idx.oturum!==undefined?(trLower(al(r,'oturum')).includes('sabah')?'sabah':trLower(al(r,'oturum')).includes('öğle')||trLower(al(r,'oturum')).includes('ogle')?'oglen':'tam'):'tam',
      gunler: normGunler(al(r,'gunler')) };
  }).filter(Boolean);
}

          $('#tiAiMsg').innerHTML='<span class="spinner"></span> düzenleniyor…';
          const alanlar = isOgr?'ad, oturum(sabah/oglen), servis, dersTuru(bireysel/grup/ikisi), tani, aylikBireysel(sayı), aylikGrup(sayı), durum(aktif/mezun/askida), veli, telefon':'ad, brans, oturum(tam/sabah/oglen), gunler(1-7 dizi, Pzt=1)';
          const prompt=`Aşağıdaki serbest metni ${isOgr?'öğrenci':'uzman'} kayıtlarına çevir. SADECE geçerli JSON dizisi döndür, başka hiçbir şey yazma. Her nesne alanları: ${alanlar}. Bilinmeyen alanları boş/0 bırak.\n\nMETİN:\n${t}`;
          try{ let c=await generateText(prompt,{kisa:true}); c=c.replace(/```json|```/g,'').trim(); const arr=JSON.parse(c);
            const rows=[Object.keys(arr[0])].concat(arr.map(o=>Object.values(o).map(x=>x==null?'':String(x))));
            kayitlar = isOgr?ogrKayitlariUret(rows):uzmKayitlariUret(rows); onizle(); $('#tiAiMsg').textContent=kayitlar.length+' kayıt çıkarıldı.';
          }catch(e){ $('#tiAiMsg').textContent='AI çıktısı okunamadı, tekrar deneyin.'; }
        };
      } else {
        p.innerHTML=`<div class="note-box" style="font-size:.82rem;margin-bottom:8px">Şablonu indirip Excel'de doldurun, sonra <b>Excel/CSV</b> sekmesinden yükleyin.</div>
          <div class="card pad" style="font-family:monospace;font-size:.78rem;white-space:pre-wrap;overflow:auto">${esc(basliklar)}\n${esc(ornek)}</div>
          <button class="btn block sm" id="tiSablon" style="margin-top:8px">⬇️ CSV şablonu indir</button>`;
        $('#tiSablon').onclick=()=>{ const csv=basliklar.replace(/;/g,';')+'\n'+ornek; const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=isOgr?'ogrenci-sablon.csv':'uzman-sablon.csv'; a.click(); toast('Şablon indirildi ✓','ok'); };
      }
    }
    $$('[data-ti]').forEach(b=>b.onclick=()=>{ sekme=b.dataset.ti; $$('[data-ti]').forEach(x=>x.classList.toggle('on',x===b)); pane(); });
    pane(); onizle();
    $('#tiAktar').onclick=()=>{
      if(!kayitlar.length) return;
      let ekle=kayitlar, atlanan=0;
      if($('#tiDedup').checked){ const mevcut=new Set((isOgr?DB.students:DB.uzmanlar).map(x=>trLower(x.ad))); ekle=kayitlar.filter(k=>{ if(mevcut.has(trLower(k.ad))){atlanan++;return false;} mevcut.add(trLower(k.ad)); return true; }); }
      if(isOgr) DB.students.push(...ekle); else DB.uzmanlar.push(...ekle);
      save(); close(); render();
      toast(`${ekle.length} ${isOgr?'öğrenci':'uzman'} eklendi${atlanan?` (${atlanan} mükerrer atlandı)`:''} ✓`,'ok');
    };
  });
}

</script>
</body>
</html>
